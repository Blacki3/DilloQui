[build]
  command = "npm run build"
  publish = "dist"

# Branch deploys (non-production) → splash PROVAMI
# URL tipo https://cursor-mostra-provami-splash--TUOSITO.netlify.app
# Attiva Branch deploys in Netlify → Site settings → Build & deploy → Branches
[context.branch-deploy.environment]
  VITE_MOSTRA = "true"

[context.deploy-preview.environment]
  VITE_MOSTRA = "true"

[context.production.environment]
  VITE_MOSTRA = "false"

# SPA: tutte le rotte tornano a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
