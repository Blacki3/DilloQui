[build]
  command = "npm run build"
  publish = "dist"

# Branch deploy `mostra` → URL tipo https://mostra--TUOSITO.netlify.app
# Attiva Branch deploys in Netlify → Site settings → Build & deploy → Branches
[context.mostra.environment]
  VITE_MOSTRA = "true"

[context.production.environment]
  VITE_MOSTRA = "false"

# SPA: tutte le rotte tornano a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
